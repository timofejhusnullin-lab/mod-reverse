name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - 'instant-break/**'
      - 'time-forward/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: timerewind
          path: build/libs/*.jar
      - name: Publish jar to branch "jar"
        run: |
          mkdir /tmp/out && cp build/libs/timerewind-*.jar /tmp/out/
          rm -f /tmp/out/*-sources.jar
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan jar
          git rm -rf -q .
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -q -m "Built jar"
          git push -f origin jar
