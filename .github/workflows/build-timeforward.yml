name: build-timeforward
on:
  push:
    branches: [main]
    paths: ['time-forward/**', '.github/workflows/build-timeforward.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-forward
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build
      - name: Publish jar to branch "jar-timeforward"
        run: |
          mkdir /tmp/out && cp build/libs/timeforward-*.jar /tmp/out/
          rm -f /tmp/out/*-sources.jar
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan jar-timeforward
          git rm -rf -q .
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -q -m "Built jar"
          git push -f origin jar-timeforward
